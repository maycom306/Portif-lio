server {
    listen 80;
    server_name localhost;

    # Diretório raiz dos arquivos estáticos
    root /usr/share/nginx/html;
    index index.html;

    # Habilita compressão gzip para performance
    gzip on;
    gzip_types text/plain text/css application/javascript text/html;
    gzip_min_length 1000;

    # Cache para assets estáticos (imagens, CSS, JS)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redireciona tudo para index.html (SPA-friendly)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Oculta versão do Nginx por segurança
    server_tokens off;
}
